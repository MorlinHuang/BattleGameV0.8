<script>
/* 定种子（film / bench 用）：同 index.html 的 mulberry32 */
(function () {
  const sd = +(new URLSearchParams(location.search).get('seed') || 7) | 0;
  let a = sd || 1;
  window.seed = (n) => { a = n | 0 || 1; };
  Math.random = function () { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
})();
/* 模拟时钟上的 setTimeout：旧配方用 setTimeout 错开第二道环（thud / bloom）。实验台按固定步长推进模拟时间，
   墙钟定时器在胶片里会全部错过 —— 这里把它挂到模拟时钟上，等价于正式页"没有顿帧时墙钟 ≈ 游戏时间"的那种情况 */
const SIM = { t: 0, q: [] };
const realSetTimeout = window.setTimeout.bind(window);
window.setTimeout = (fn, ms) => { SIM.q.push([SIM.t + (ms || 0) / 1000, fn]); return 0; };
function simAdvance(dt) {
  SIM.t += dt;
  for (let i = SIM.q.length - 1; i >= 0; i--) if (SIM.q[i][0] <= SIM.t + 1e-9) { const f = SIM.q[i][1]; SIM.q.splice(i, 1); f(); }
}

<script>
'use strict';
const Q = new URLSearchParams(location.search);
const V = Q.get('v') || String(Date.now());
const W = 960, VIEW = { y0: 740, h: 640 };          // 看画布 y 740 ~ 1380 这一条（两个人的身子、地板）
const HIT = [236, 1000];                              // 命中点：女主腰（左边，side +1）
const SIDE = +1;
const MUZZLE = [800, 1250];                           // 光束出口（右下前景跪着的那个人的手）
const FOOT = [600, 1330];                             // 落地点（两人之间的地板）

/* ---- 光束配置：四人的 cfg.beam 原文（trio_buddy.js B22 / B19、trio_bestie.js G23 / G30） + 各自的配方 ---- */
const LOOKS = {
  B22: { recipe: 'water', beam: { fire: 0.6, drip: 0.1, ball: 26, glow: [120, 210, 255], edge: [30, 90, 200],
         layers: [[34, [30, 90, 200], 0.35], [22, [90, 180, 255], 0.8], [11, [210, 240, 255], 0.95], [4, [255, 255, 255], 1]] } },
  B19: { recipe: 'water', beam: { fire: 0.6, drip: 0.1, ball: 16, glow: [180, 230, 255], edge: [40, 110, 220],
         layers: [[26, [40, 110, 220], 0.35], [16, [140, 210, 255], 0.8], [8, [225, 245, 255], 0.95], [3, [255, 255, 255], 1]] } },
  G23: { recipe: 'thud', beam: { fire: 0.38, drip: 0.1, ball: 40, glow: [255, 170, 70], edge: [220, 60, 30],
         layers: [[84, [170, 30, 20], 0.3], [64, [255, 90, 40], 0.6], [42, [255, 160, 70], 0.85], [20, [255, 230, 160], 1], [7, [255, 255, 255], 1]] } },
  G30: { recipe: 'star', beam: { fire: 0.45, drip: 0.1, ball: 30, glow: [120, 255, 150], edge: [20, 120, 60],
         layers: [[40, [20, 120, 60], 0.3], [28, [60, 200, 100], 0.6], [16, [140, 255, 170], 0.9], [6, [240, 255, 240], 1]] } },
};
/* B23 斩痕 cfg（trio_buddy.js B23 atk.slash） */
const SLASH = { n: 3, gap: 0.08, len: 230, w: 18, life: 0.5, color: [90, 230, 110], ang: -0.5, spread: 0.25 };
const RECIPES = ['thud', 'star', 'splash', 'feather', 'melon', 'slash', 'petal', 'debris', 'hollow', 'water', 'ball', 'rouge'];
const WHO = { thud: 'B29', star: 'B12', splash: 'B27', feather: 'B18', melon: 'B28', slash: 'B23', petal: 'B11', debris: 'B8', hollow: 'B15', water: 'B19', ball: 'B21', rouge: 'G 口红' };

let OLD = null;                                       // 旧配方（从 main.js / trio.js 原文切出来执行）
let OLD2 = null, P2 = null, CREW = null;              // 新侧兜底用的旧配方（绑第二个粒子池）、crew.js 水柱 / 喷雾旧画法
let BG = null;

/* ---- 旧画法：trio.js drawBeam（fire 分支）+ orb，trio.js:1220-1245 原样 ---- */
function oldOrb(ctx, x, y, r, B) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, `rgba(${B.glow[0]},${B.glow[1]},${B.glow[2]},0.95)`);
  g.addColorStop(0.75, `rgba(${B.edge[0]},${B.edge[1]},${B.edge[2]},0.6)`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}
function oldBeam(ctx, B, h, tg, t, ph, chargeR) {
  ctx.save(); ctx.globalCompositeOperation = 'source-over';
  if (ph === 'charge') oldOrb(ctx, h[0], h[1], chargeR, B);
  else {
    const e = Math.min(1, t / 0.08), fade = Math.min(1, (B.fire - t) / 0.15), x1 = h[0] + (tg[0] - h[0]) * e, y1 = h[1] + (tg[1] - h[1]) * e;
    ctx.globalAlpha = fade; ctx.lineCap = 'round';
    for (const [w, c, a] of B.layers) {
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`; ctx.lineWidth = w * (1 + 0.1 * Math.sin(t * 50 + w));
      ctx.beginPath(); ctx.moveTo(h[0], h[1]); ctx.lineTo(x1, y1); ctx.stroke();
    }
    oldOrb(ctx, h[0], h[1], B.ball, B); oldOrb(ctx, x1, y1, B.ball * 1.2, B);
  }
  ctx.restore();
}
/* ---- 旧画法：trio.js drawSlash（trio.js:1176-1191 原样） ---- */
function oldSlash(ctx, s) {
  if (s.t < 0) return;
  const Q = SLASH, c = Q.color, R = Q.len / 2, life = Q.life || 0.45, draw = Math.min(1, s.t / 0.07), fade = Math.min(1, (life - s.t) / (life * 0.5));
  ctx.save(); ctx.translate(s.p[0], s.p[1]); ctx.rotate(s.ang); ctx.globalAlpha = Math.max(0, fade);
  const a0 = -0.9, a1 = a0 + 1.8 * draw;
  for (const [w, col] of [[Q.w * 1.35, 'rgba(15,30,70,.55)'], [Q.w * 2.2, `rgba(${c[0]},${c[1]},${c[2]},.35)`], [Q.w, `rgba(${c[0]},${c[1]},${c[2]},.95)`], [Q.w * 0.35, 'rgba(255,255,255,1)']]) {
    ctx.fillStyle = col; ctx.beginPath();
    ctx.arc(0, R * 0.4, R, a0 - Math.PI / 2, a1 - Math.PI / 2);
    ctx.arc(0, R * 0.4 + w, R - w * 0.2, a1 - Math.PI / 2, a0 - Math.PI / 2, true);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ======================= 第二批：件的配置（cfg 原文，trio_bestie.js / trio_buddy.js）与场景几何 ======================= */
const easeOut = (u) => 1 - Math.pow(1 - u, 3), backOut = (u) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const BOY = [640, 1000];                              // 闺蜜侧的落点（男主在画面右边，这张底图没画他：取他脸的高度一带）
const RIB = {                                         // whip：A.whip + phases 原文；dir 默认 = 自检量的出手帧手臂方向（P10②，"实测"）
  G9: { kind: 'whip', from: [170, 860], to: BOY, dir: -52, phases: [0.14, 0.08, 0.22], style: 'silk',
        Q: { w: 14, taper: 0.35, amp: 30, waves: 1.3, hz: 3, color: '#e0303a', edge: 'rgba(110,10,20,.9)' } },
  G13: { kind: 'whip', from: [170, 860], to: BOY, dir: -18, phases: [0.14, 0.08, 0.22], style: 'silk',
         Q: { w: 10, taper: 0.5, amp: 26, waves: 1.3, hz: 3, color: '#f6f4f8', edge: 'rgba(120,120,150,.9)', tip: [18, 13, '#e8b52c'] } },
  G17: { kind: 'whip', from: [170, 860], to: BOY, dir: null, phases: [0.14, 0.08, 0.22], style: 'blade',
         Q: { w: 7, taper: 0.55, amp: 26, waves: 2, hz: 4, color: '#f7a3c6', edge: 'rgba(120,30,70,.9)', tip: [30, 6, '#ffd6e6'] } },
  /* punch：atk 原文。屏幕上的手腕 / 拳头静止位 = at + (格内 − anchor) × s（B12 at [940, 560, 1] anchor [300, 180]；这里整体挪到画面里） */
  B12: { kind: 'punch', wr: [896, 930], fr: [876, 930], to: HIT, dir: null, s: 1, style: 'arm', sheet: 'assets/trio/B12_straw.webp', cell: [305, 360], cols: 2, fi: 0,
         A: { fist: [0, 44, 36, 96], fistC: [16, 70], wrist: [36, 70], armW: 16, skin: '#f7cba0', skinShade: 'rgba(214,146,96,.5)', skinEdge: '#5a3420', fistZ: 1.35, phases: [0.16, 0.1, 0.34] } },
  G29: { kind: 'punch', wr: [252, 1157], fr: [279.4, 1154], to: BOY, dir: null, s: 0.98, style: 'bamboo', sheet: 'assets/trio/G29_huangrong.webp', cell: [309, 339], cols: 4, fi: 2,
         A: { fist: [270, 145, 308, 163], fistC: [290, 154], wrist: [262, 157], armW: 8, skin: '#6cbf45', skinShade: 'rgba(40,110,30,.55)', skinEdge: '#1f3d12', fistZ: 1.3, phases: [0.16, 0.12, 0.22] } },
};
const JETS = {
  B1: { draw: 'stream', m: [840, 1060], to: HIT, face: -1, recipe: 'water', J: { V: 1250, G: 900, rate: 55, life: 1.6, miss: 90, hitEvery: 0.3, spread: 0, vJit: 0 } },
  G1: { draw: 'mist', m: [150, 960], to: BOY, face: 1, recipe: 'pepper', J: { V: 1100, G: 60, drag: 1.0, rate: 90, spread: 0.1, vJit: 0.15, life: 0.8, miss: 60, snap: 12, hitEvery: 0.3, pulse: [0.42, 0.14] } },
  B20: { draw: 'spray', m: [820, 900], to: HIT, face: -1, recipe: 'splash', Q: { dur: 0.6, rate: 90, T: 0.3, tick: 0.15, color: [235, 195, 110], r: 18, spread: 0.14 } },
};
const QIS = {                                          // atk.slash 原文；from = 出手点（刀尖），to = 落点；recipe 同 cfg.recipe
  B23: { from: [860, 1180], to: HIT, dir: null, recipe: 'star', Q: { n: 3, gap: 0.08, len: 230, w: 18, life: 0.5, color: [90, 230, 110], ang: -0.5, spread: 0.25 } },
  G14: { from: [190, 800], to: BOY, dir: null, recipe: 'star', Q: { n: 2, gap: 0.12, len: 240, w: 20, life: 0.5, color: [255, 215, 110], ang: -0.6, spread: 0.2 } },
};
const TRAILS = {                                       // throw：T / arc / spin 原文；item 图（平面 prop 或 3D 转盘图集）
  G16: { recipe: 'foxfire', trail: 'fox', T: 0.5, arc: 0.2, spin: 10, prop: 'assets/world/trio_g16_foxfire.webp', scale: 0.45 },
  G15: { recipe: 'water', trail: 'gem', T: 0.55, arc: 0.2, spin: 5.7, atlas: { src: 'assets/trio/prop_necklace.webp', n: 36, cols: 6, cell: 79, scale: 1.39 }, r: 26 },
  G20: { recipe: 'crescent', trail: 'moon', T: 0.5, arc: 0.2, spin: 12, prop: 'assets/world/trio_g20_crescent.webp', scale: 0.5 },
};
const ROPE_G11 = { w: 7, fill: '#c9a36a', edge: 'rgba(70,45,20,.85)', wood: ['#b07a42', '#d9a468', 'rgba(90,55,25,.6)'], flowers: '#f59ab8' };
const PIECES = { hit: null, dust: null, beam: Object.keys(LOOKS), ribbon: Object.keys(RIB), jet: Object.keys(JETS), qi: Object.keys(QIS), trail: Object.keys(TRAILS), rope: ['G11'], petal: ['G7'] };
const IMGS = {};                                       // 场景里要用的角色图集 / 道具图（main 里预载）

/* ---- 旧画法：trio.js drawWhip（工作区 trio.js:1086-1115，前排：中线直、往下垂 sag）原样 ---- */
function oldWhip(ctx, Q, h, tg, t, Ph, s) {
  const e = t < Ph[0] ? easeOut(t / Ph[0]) : t < Ph[0] + Ph[1] ? 1 : 1 - Math.pow(Math.min(1, (t - Ph[0] - Ph[1]) / Ph[2]), 2);
  const dx = tg[0] - h[0], dy = tg[1] - h[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, N = 22;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const f = i / N, w = Math.sin(Math.PI * f) * (Q.amp || 24) * (1.2 - e) * Math.sin(6.2832 * (f * (Q.waves || 1.5) - t * (Q.hz || 4)));
    const sag = Math.sin(Math.PI * f) * L * 0.08 * (1 - e * 0.6), mx = h[0] + dx * f * e, my = h[1] + dy * f * e;
    pts.push([mx + nx * w, my + ny * w + sag]);
  }
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [grow, col] of [[4, Q.edge || 'rgba(40,20,10,.85)'], [0, Q.color || '#c0302a']]) {
    ctx.strokeStyle = col;
    for (let i = 0; i < N; i++) {
      ctx.lineWidth = (Q.w || 8) * s * (1 - (1 - (Q.taper != null ? Q.taper : 0.5)) * i / N) + grow;
      ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
    }
  }
  if (Q.tip) {
    const [tl, tw, tc] = Q.tip, a = pts[N], c = pts[N - 2], ang = Math.atan2(a[1] - c[1], a[0] - c[0]);
    ctx.translate(a[0], a[1]); ctx.rotate(ang);
    ctx.lineWidth = tw * s + 4; ctx.strokeStyle = Q.edge || 'rgba(40,20,10,.85)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tl * s, 0); ctx.stroke();
    ctx.lineWidth = tw * s; ctx.strokeStyle = tc; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tl * s, 0); ctx.stroke();
    ctx.lineWidth = tw * s * 0.3; ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(tl * s * 0.15, -tw * s * 0.2); ctx.lineTo(tl * s * 0.85, -tw * s * 0.2); ctx.stroke();
  }
  ctx.restore();
}
/* 抽打的 e（drawWhip 同式）与出拳的 k（trio.js punchK 同式） */
const whipE = (t, Ph) => t < Ph[0] ? easeOut(t / Ph[0]) : t < Ph[0] + Ph[1] ? 1 : 1 - Math.pow(Math.min(1, (t - Ph[0] - Ph[1]) / Ph[2]), 2);
const punchK = (t, P) => t < P[0] ? easeOut(t / P[0]) : t < P[0] + P[1] ? 1 : 1 - backOut(Math.min(1, (t - P[0] - P[1]) / P[2]));
/* 拳头 / 棒头：从出手帧那一格抠（trio.js drawArm 末尾同式），转到 ang */
function drawFist(ctx, R, fx, fy, ang) {
  const A = R.A, [fx0, fy0, fx1, fy1] = A.fist, c = A.fistC, z = R.s * A.fistZ, rest = Math.atan2(R.fr[1] - R.wr[1], R.fr[0] - R.wr[0]), im = IMGS[R.sheet];
  const ox = (R.fi % R.cols) * R.cell[0], oy = Math.floor(R.fi / R.cols) * R.cell[1];
  ctx.save(); ctx.translate(fx, fy); ctx.rotate(ang - rest);
  ctx.drawImage(im, ox + fx0, oy + fy0, fx1 - fx0, fy1 - fy0, (fx0 - c[0]) * z, (fy0 - c[1]) * z, (fx1 - fx0) * z, (fy1 - fy0) * z);
  ctx.restore();
}
/* ---- 旧画法：trio.js drawArm（工作区 trio.js:1201-1226，前排）原样，拳头走 drawFist ---- */
function oldArm(ctx, R, k, pt) {
  const A = R.A, s = R.s, wr = R.wr, fr = R.fr, tg = R.to;
  const fx = fr[0] + (tg[0] - fr[0]) * k, fy = fr[1] + (tg[1] - fr[1]) * k;
  const len = Math.hypot(fx - wr[0], fy - wr[1]), nx = -(fy - wr[1]) / (len || 1), ny = (fx - wr[0]) / (len || 1);
  const wob = pt < A.phases[0] + A.phases[1] ? 0.08 : 0.16 * Math.sin(pt * 38);
  const sag = len * wob * (ny < 0 ? -1 : 1);

          while (S.e >= 1 && S.t <= Q.dur) {                 // trio.js stepFx b.sp 同式
            S.e -= 1;
            const a = Math.atan2(tg[1] - h0[1], tg[0] - h0[0]) + (Math.random() * 2 - 1) * (Q.spread || 0.12), d = Math.hypot(tg[0] - h0[0], tg[1] - h0[1]);
            const v = d / (Q.T || 0.3) * (0.85 + Math.random() * 0.25), T = Q.T || 0.3, p2 = [h0[0] + Math.cos(a) * v * T, h0[1] + Math.sin(a) * v * T];
            const c = TrioFX.ctrl(h0, dir, p2);
            puffs.push({ x: h0[0], y: h0[1], p0: h0, c, p2, T, vx: 0, vy: 0, t: 0, life: T * (1.3 + Math.random() * 0.5), j: Math.random() });
            sp.emit(h0, dir != null ? dir : a);
          }
          if (S.t >= (Q.T || 0.3) + S.h * Q.tick && S.t <= Q.dur + (Q.T || 0.3)) {
            if (S.h === 0) { OLD[C.recipe].burst(tg[0], tg[1], side, s); NEWR(C.recipe).burst(tg[0], tg[1], side, s); }
            else { OLD.water.drip(tg[0], tg[1], side); TrioFX.RECIPE.water.drip(tg[0], tg[1], side); }
            S.h++;
          }
          for (let i = puffs.length - 1; i >= 0; i--) {     // trio.js stepShot 'puff' 同式
            const q = puffs[i]; q.t += dt;
            if (q.t < q.T) { const e = q.t / q.T, u = 1 - e, x = u * u * q.p0[0] + 2 * u * e * q.c[0] + e * e * q.p2[0], y = u * u * q.p0[1] + 2 * u * e * q.c[1] + e * e * q.p2[1];
              q.vx = (x - q.x) / dt; q.vy = (y - q.y) / dt; q.x = x; q.y = y; }
            else { if (q.t > q.life * 0.55) { const k = Math.exp(-6 * dt); q.vx *= k; q.vy *= k; } q.x += q.vx * dt; q.y += q.vy * dt; }
            if (q.t >= q.life) puffs.splice(i, 1);
          }
        },
        drawOld(ctx) { for (const q of puffs) oldPuff(ctx, Q, q); },
        drawNew(ctx) { for (const q of puffs) sp.puff(ctx, q); },
      };
    }
    let first = true;
    const hit = (x, y) => { const k = first ? s : 0.55; first = false; OLD[C.recipe].burst(x, y, side, k); NEWR(C.recipe).burst(x, y, side, k); };
    const drip = (x, y) => { OLD[C.recipe === 'water' ? 'water' : 'pepper'].drip(x, y, side); TrioFX.RECIPE[C.recipe === 'water' ? 'water' : 'pepper'].drip(x, y, side); };
    const sim = jetSim(C, drip, hit), h = C.draw === 'stream' ? TrioFX.stream() : TrioFX.mist({ life: C.J.life });
    return {
      T: 2.0,
      step(t, dt) { sim.step(dt, t >= T0 && t < 1.6); },
      drawOld(ctx) { ctx.save(); if (C.draw === 'stream') CREW.drawStream(ctx, sim.drops, { m: C.m }); else CREW.drawMist(ctx, sim.drops); ctx.restore(); },
      drawNew(ctx) { const d = opt.dir ? sim.dir() + opt.dir * Math.PI / 180 : sim.dir(); h.draw(ctx, sim.drops, C.m, d); },
    };
  }
  if (mode === 'qi') {
    const C = QIS[opt.look], Q = C.Q, side = C.to === HIT ? +1 : -1, dir = dirOf(C.from, C.to, C.dir, opt.dir), T0 = 0.05, FLY = 0.12;
    const cuts = [];
    for (let i = 0; i < Q.n; i++) cuts.push({ i, p: [C.to[0] + (Math.random() - 0.5) * 40, C.to[1] + (Math.random() - 0.5) * 50], ang: Q.ang + (Math.random() * 2 - 1) * Q.spread + (i % 2 ? Math.PI * 0.12 : 0) });
    const olds = cuts.map(c => ({ t: -T0 - c.i * Q.gap, p: c.p, ang: c.ang, hit: false })), news = cuts.map(c => ({ t: -T0 - c.i * Q.gap, hit: false, flown: false, ...c }));
    let firstO = true, firstN = true;
    return {
      T: 1.0,
      step(t, dt) {
        for (const q of olds) { q.t += dt; if (!q.hit && q.t >= 0.05) { q.hit = true; OLD[C.recipe].burst(q.p[0], q.p[1], side, firstO ? s : 0.55); firstO = false; } }
        for (const q of news) {
          q.t += dt;
          if (!q.flown && q.t >= 0) { q.flown = true; TrioFX.qi(C.from, dir, q.p, Q.color, { T: FLY, len: Q.len, ang: q.ang, life: Q.life }); }
          if (!q.hit && q.t >= FLY + 0.05) { q.hit = true; NEWR(C.recipe).burst(q.p[0], q.p[1], side, firstN ? s : 0.55); firstN = false; }
        }
      },
      drawOld(ctx) { for (const q of olds) if (q.t < Q.life) oldSlashQ(ctx, q, Q); },
      drawNew() {},
    };
  }
  if (mode === 'trail') {
    const C = TRAILS[opt.look], h = TrioFX.trail(TrioFX.TRAIL[C.trail]), p0 = [200, 840], p2 = BOY, T0 = 0.05;
    const d = Math.hypot(p2[0] - p0[0], p2[1] - p0[1]), c = [(p0[0] + p2[0]) / 2, Math.min(p0[1], p2[1]) - C.arc * d];
    const sh = { x: p0[0], y: p0[1], t: 0, ang: 0, vx: 0, vy: 0, fall: null, stuck: null }, side = -1;
    let on = false, done = false;
    return {
      T: 1.5,
      step(t, dt) {
        if (t < T0 || done) return;
        on = true;
        if (sh.fall != null) {                               // trio.js stepShot 打中弹开同式
          sh.vy += 1800 * dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.ang += C.spin * dt; sh.fall -= dt;
          if (sh.fall <= 0) done = true;
        } else {
          sh.t += dt;
          const e = Math.min(1, sh.t / C.T), u = 1 - e, nx = u * u * p0[0] + 2 * u * e * c[0] + e * e * p2[0], ny = u * u * p0[1] + 2 * u * e * c[1] + e * e * p2[1];
          sh.vx = (nx - sh.x) / dt; sh.vy = (ny - sh.y) / dt; sh.x = nx; sh.y = ny; sh.ang += C.spin * dt;
          if (e >= 1) { OLD[C.recipe].burst(sh.x, sh.y, side, s); NEWR(C.recipe).burst(sh.x, sh.y, side, s); sh.fall = 0.9; sh.vx = 110; sh.vy = -520; }
        }
        h.track(sh, dt);
      },
      drawOld(ctx) { if (on && !done) { ctx.save(); ctx.globalAlpha = sh.fall != null ? Math.min(1, sh.fall / 0.3) : 1; drawItem(ctx, C, sh); ctx.restore(); } },
      drawNew(ctx) { if (!on) return; h.draw(ctx, sh); if (!done) { ctx.save(); ctx.globalAlpha = sh.fall != null ? Math.min(1, sh.fall / 0.3) : 1; drawItem(ctx, C, sh); ctx.restore(); } },
    };
  }
  if (mode === 'rope') {
    const R = ROPE_G11, PV = [330, 160], st = { t: 0 };
    const at = (t) => { const th = 0.42 * Math.sin(2.6 * t), w = 0.42 * 2.6 * Math.cos(2.6 * t), co = Math.cos(th), si = Math.sin(th);
      const P = (x, y) => [PV[0] + x * co - y * si, PV[1] + x * si + y * co];
      return { a: P(-85, 900), b: P(85, 900), ta: P(-85, 560), tb: P(85, 560), w }; };
    return {
      T: 2.42,
      step(t) { st.t = t; },
      drawOld(ctx) { const q = at(st.t); for (const [e, top, i] of [[q.a, q.ta, 0], [q.b, q.tb, 1]]) { oldRope(ctx, R, [e, top], R.w); ropeFlowers(ctx, e, top, R.flowers, i * 3); } swingBoard(ctx, R, q.a, q.b); },
      drawNew(ctx) { const q = at(st.t); for (const [e, top, i] of [[q.a, q.ta, 0], [q.b, q.tb, 1]]) { TrioFX.rope(ctx, [e, top], R.w, R.fill, R.edge, -q.w * 14); ropeFlowers(ctx, e, top, R.flowers, i * 3); } swingBoard(ctx, R, q.a, q.b); },
    };
  }
  if (mode === 'petal') {
    /* 闺蜜 petal 五人（G7 G11 G17 G18 G26）打男主：首击 s 1.7，之后每 0.35 s 补一下（s 0.55）—— 正式页连送时就是这样叠 */
    const X = [600, 1010], side = -1;
    let k = 0;
    return {
      T: 1.8,
      step(t) {
        while (k < 3 && t >= 0.05 + k * 0.35) { const ss = k ? 0.55 : s; OLD.petal.burst(X[0], X[1], side, ss); TrioFX.RECIPE.petal.burst(X[0], X[1], side, ss); k++; }
      },
      drawOld() {}, drawNew() {},
      marker(ctx) { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(X[0], X[1], 200, 0, 6.283); ctx.stroke(); ctx.setLineDash([]); },
    };
  }
  throw new Error('未知模式 ' + mode);
}

/* 一帧：底图 → 旧 / 新各自的特效。旧粒子走 Particles（正式页 fx.js 原样），新的走 TrioFX —— 两套池各管各的，
   但两边画在不同的 canvas 上：Particles.draw 只画到旧那张，TrioFX.draw 只画到新那张 */
function render(sc, cOld, cNew) {
  for (const [c, side] of [[cOld, 'old'], [cNew, 'new']]) {
    const g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(BG, 0, 0);
    g.translate(0, -VIEW.y0);
    if (side === 'old') { sc.drawOld(g); Particles.draw(g); }
    else { sc.drawNew(g); P2.draw(g); TrioFX.draw(g); }
    if (sc.marker) sc.marker(g);
  }
}
function step(sc, t, dt) { simAdvance(dt); sc.step(t, dt); Particles.update(dt); P2.update(dt); TrioFX.update(dt); }

/* ---- 胶片：固定步长推进，到采样时刻把两边裁一块贴到 sheet 上 ---- */
function film(kind) {

    trail: { times: [0.15, 0.27, 0.4, 0.52, 0.62, 0.9], crop: [100, 770, 860, 430] },           // 0.05 出手、0.55 打中

    slash: { times: [0.06, 0.09, 0.14, 0.22, 0.32, 0.45], crop: [HIT[0] - 200, HIT[1] - 230, 520, 460] },

/* ---- 压测：同屏 6 人 + 主角的特效负载（两道光束同时轰、每秒 4 次首击级命中轮换配方、每秒 10 次 drip、两条滑行尘），旧 / 新各跑一遍 ---- */
function bench(frames) {
  const OFF = Q.get('benchoff');                                       // 差值分账：beam 不画光束 / part 不画粒子 / all 都不画（剩下的是生成 + 更新）（skill chashouji-verify 第四节）
  const c = document.getElementById('cNew'), g = c.getContext('2d');
  const run = (side) => {
    seed(5); Particles.clear(); P2.clear(); TrioFX.clear(); SIM.q.length = 0;
    const fxs = [TrioFX.beam(LOOKS.B22.beam), TrioFX.beam(LOOKS.G23.beam)], st = [{}, {}];
    /* bench2：第二批的件同屏再加一份 —— B1 水柱一直喷、G9 红绸每 0.6 s 抽一下、B12 橡皮臂每 0.8 s 出一拳、G16 狐火每 0.6 s 扔一个（带火尾）、
       B23 每 1.2 s 三道剑气。水柱的水滴两侧各跑一份同样的模拟（定种子），落点溅射走各自的 water.drip */
    const B2OFF = new Set((Q.get('b2off') || '').split(','));      // 第二批分账：&b2off=stream,silk,arm,fox 不画这几件的本体（它们放的粒子照常）
    const B2 = Q.get('bench2') ? (() => {
      const W = side === 'old' ? OLD.water : TrioFX.RECIPE.water;
      return { jet: jetSim(JETS.B1, (x, y) => W.drip(x, y, +1), () => {}), stream: TrioFX.stream(), silk: TrioFX.ribbon(RIB.G9.Q, 'silk'), arm: TrioFX.ribbon(RIB.B12.A, 'arm'),
               fox: TrioFX.trail(TrioFX.TRAIL.fox), shots: [], cuts: [], lastQi: -1 };
    })() : null;
    const ms = [], cnt = [];
    let t = 0, last = 0;
    for (let f = 0; f < frames; f++) {
      const dt = 1 / 60;
      const tA = performance.now();
      simAdvance(dt); t += dt;
      if (Math.floor(t * 4) !== Math.floor((t - dt) * 4)) {          // 每 0.25 s 一次首击（s 1.7）
        const r = RECIPES[(last++) % RECIPES.length];
        const x = 150 + (last % 3) * 60, y = 950 + (last % 4) * 40;
        if (side === 'old') (OLD[r === 'slash' ? 'star' : r]).burst(x, y, SIDE, 1.7); else TrioFX.RECIPE[r].burst(x, y, SIDE, 1.7);
      }
      if (Math.floor(t * 10) !== Math.floor((t - dt) * 10)) { if (side === 'old') OLD.water.drip(240, 1000, SIDE); else TrioFX.RECIPE.water.drip(240, 1000, SIDE); }
      const ph = (t % 1.2), firing = ph > 0.45 && ph < 1.05;
      const from = (i) => [MUZZLE[0] - i * 200, MUZZLE[1] - i * 300], to = (i) => [HIT[0], HIT[1] - i * 80];
      if (side === 'new') {
        fxs.forEach((fx, i) => {
          if (ph <= 0.45) fx.charge(dt, from(i)[0], from(i)[1], 20);
          else if (firing) fx.fire(dt, from(i), null, to(i), Math.min(1, (ph - 0.45) / 0.08), Math.min(1, (1.05 - ph) / 0.15));
          else fx.rest();
        });
        if (Q.get('benchskid') !== '0') st.forEach((o, i) => TrioFX.skid(o, 300 + 400 * ((t * 0.7 + i * 0.5) % 1), 1340, -600, dt, 1));   // 旧的没有滑行尘；&benchskid=0 对等比
      }
      if (B2) {
        B2.jet.step(dt, true);
        if (Math.floor(t / 0.6) !== Math.floor((t - dt) / 0.6)) B2.shots.push({ x: 200, y: 840, t: 0, ang: 0, vx: 0, vy: 0, fall: null, stuck: null });
        for (const sh of B2.shots) {
          sh.t += dt; const e = Math.min(1, sh.t / 0.5), u = 1 - e, nx = u * u * 200 + 2 * u * e * 420 + e * e * 640, ny = u * u * 840 + 2 * u * e * 740 + e * e * 1000;
          sh.vx = (nx - sh.x) / dt; sh.vy = (ny - sh.y) / dt; sh.x = nx; sh.y = ny; sh.ang += 10 * dt;
          if (side === 'new') B2.fox.track(sh, dt);
        }
        while (B2.shots.length && B2.shots[0].t >= 0.5) B2.shots.shift();
        const qi = Math.floor(t / 1.2);
        if (qi !== B2.lastQi) {
          B2.lastQi = qi;
          for (let i = 0; i < 3; i++) {
            const p = [HIT[0] + (Math.random() - 0.5) * 40, HIT[1] + (Math.random() - 0.5) * 50], ang = -0.5 + (Math.random() * 2 - 1) * 0.25;
            if (side === 'new') TrioFX.qi(QIS.B23.from, null, p, QIS.B23.Q.color, { T: 0.12, len: 230, ang, life: 0.5, delay: i * 0.08 });
            else B2.cuts.push({ t: -i * 0.08, p, ang });
          }
        }
        for (const c of B2.cuts) c.t += dt;
        while (B2.cuts.length && B2.cuts[0].t >= 0.5) B2.cuts.shift();
      }
      Particles.update(dt); TrioFX.update(dt);
      const tB = performance.now();
      g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(BG, 0, 0); g.translate(0, -VIEW.y0);
      g.getImageData(0, 0, 1, 1);                                     // 先把底图这一笔做完，下面只计特效的绘制
      const tC = performance.now();
      const wt = t % 0.6, at = t % 0.8;
      if (side === 'old') {
        [LOOKS.B22.beam, LOOKS.G23.beam].forEach((B, i) => { if (ph <= 0.45 || firing) oldBeam(g, B, from(i), to(i), firing ? ph - 0.45 : ph, firing ? 'fire' : 'charge', 20); });
        if (B2) {
          CREW.drawStream(g, B2.jet.drops, { m: JETS.B1.m });
          if (wt < 0.44) oldWhip(g, RIB.G9.Q, RIB.G9.from, RIB.G9.to, wt, RIB.G9.phases, 1);
          if (at < 0.6) oldArm(g, RIB.B12, punchK(at, RIB.B12.A.phases), at);
          for (const sh of B2.shots) drawItem(g, TRAILS.G16, sh);
          for (const c of B2.cuts) oldSlash(g, c);
        }
        Particles.draw(g);
      } else {
        if (OFF !== 'beam' && OFF !== 'all') fxs.forEach(fx => fx.draw(g));
        if (B2) {
          if (!B2OFF.has('stream')) B2.stream.draw(g, B2.jet.drops, JETS.B1.m, B2.jet.dir());
          if (wt < 0.44 && !B2OFF.has('silk')) B2.silk.draw(g, RIB.G9.from, RIB.G9.dir * Math.PI / 180, RIB.G9.to, whipE(wt, RIB.G9.phases), wt, 1);
          if (at < 0.6 && !B2OFF.has('arm')) { const R = RIB.B12, k = punchK(at, R.A.phases); B2.arm.draw(g, R.wr, null, [R.fr[0] + (R.to[0] - R.fr[0]) * k, R.fr[1] + (R.to[1] - R.fr[1]) * k], 1, at, 1); const tp = B2.arm.tip(); drawFist(g, R, tp[0], tp[1], tp[2]); }
          for (const sh of B2.shots) { if (!B2OFF.has('fox')) B2.fox.draw(g, sh); drawItem(g, TRAILS.G16, sh); }
        }
        if (OFF !== 'part' && OFF !== 'all') TrioFX.draw(g);
      }
      g.getImageData(0, 0, 1, 1);                                     // 逼渲染把这一帧的绘制真做完，计时才算数
      const tD = performance.now();
      if (f >= 30) { ms.push((tB - tA) + (tD - tC)); cnt.push(side === 'old' ? Particles.count() : TrioFX.count()); }
    }
    ms.sort((a, b) => a - b);
    const mean = ms.reduce((a, b) => a + b, 0) / ms.length;
    return { mean: +mean.toFixed(3), p95: +ms[Math.floor(ms.length * 0.95)].toFixed(3), max: +ms[ms.length - 1].toFixed(3),
             peak: Math.max(...cnt), avg: Math.round(cnt.reduce((a, b) => a + b, 0) / cnt.length) };
  };
  /* &schemes=jp1,A,B,AB：新侧按每个方案各跑一遍（各自先预热一遍）；不给就是当前方案 */
  const SCH = (Q.get('schemes') || TrioFX.scheme()).split(','), sch0 = TrioFX.scheme(), res = { frames };
  res.old = run('old');
  for (const k of SCH) { TrioFX.setScheme(k); run('new'); res[k] = run('new'); }
  TrioFX.setScheme(sch0);
  return res;
}

/* ---- 交互 ---- */
const hex = (c) => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
const unhex = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
let cur = null, t0 = 0, tSim = 0;
function restart() {
  const mode = document.getElementById('mode').value;
  const key = document.getElementById('look').value;
  if (mode !== 'beam') { cur = scene(mode, { recipe: document.getElementById('recipe').value, look: key, s: +document.getElementById('s').value, dir: +document.getElementById('dir').value }); tSim = 0; return; }
  const look = JSON.parse(JSON.stringify(LOOKS[key]));
  const gl = unhex(document.getElementById('cGlow').value), ed = unhex(document.getElementById('cEdge').value);
  if (hex(gl) !== hex(look.beam.glow) || hex(ed) !== hex(look.beam.edge)) {     // 改了颜色：glow / edge 替换，layers 按新色重排（外层 edge、内层往 glow 和白推）
    look.beam.glow = gl; look.beam.edge = ed;
    const n = look.beam.layers.length;
    look.beam.layers = look.beam.layers.map(([w, , a], i) => [w, i === n - 1 ? [255, 255, 255] : i === 0 ? ed : TrioFX.palOf(gl)[i >= n - 2 ? 2 : 1], a]);
  }
  cur = scene(mode, { recipe: document.getElementById('recipe').value, look, s: +document.getElementById('s').value, dir: +document.getElementById('dir').value });
  tSim = 0;
}
function frame(now) {
  const dt = Math.min(0.05, (now - t0) / 1000) * (document.getElementById('slow').checked ? 0.25 : 1); t0 = now;
  if (cur) {
    step(cur, tSim, dt); tSim += dt;
    render(cur, document.getElementById('cOld'), document.getElementById('cNew'));
    if (tSim > cur.T && document.getElementById('loop').checked) restart();
    document.getElementById('note').textContent = `t = ${tSim.toFixed(2)} s   旧粒子 ${Particles.count()}   新粒子 ${TrioFX.count()}`;
  }
  requestAnimationFrame(frame);
}

(async function main() {
  P2 = await secondParticles();
  const [okFx] = await Promise.all([TrioFX.load(V), Particles.loadShapes(V, false), P2.loadShapes(V, false)]);
  if (!okFx) throw new Error('fx_lab: trio_fx 贴图没加载全');
  OLD = await loadOld(Particles); OLD2 = await loadOld(P2); CREW = await loadCrew(); CREWALL = await loadCrewAll();
  BG = await loadBg(Q.get('bg') || 'night');
  if (Q.get('scheme')) TrioFX.setScheme(Q.get('scheme'));
  const srcs = new Set([...Object.values(RIB).filter(r => r.sheet).map(r => r.sheet), ...Object.values(TRAILS).map(c => c.prop || c.atlas.src)]);
  await Promise.all([...srcs].map(async (k) => { IMGS[k] = await img(k + '?v=' + V); }));
  const rs = document.getElementById('recipe'), ls = document.getElementById('look');
  for (const r of RECIPES) rs.add(new Option(`${r}（${WHO[r]}）`, r));
  const fillLooks = () => {                              // 件的下拉随模式换
    const m = document.getElementById('mode').value, keep = ls.value;
    ls.length = 0;
    for (const k of PIECES[m] || []) ls.add(new Option(k, k));
    if ([...ls.options].some(o => o.value === keep)) ls.value = keep;
  };
  const syncColor = () => { if (!LOOKS[ls.value]) return; const B = LOOKS[ls.value].beam; document.getElementById('cGlow').value = hex(B.glow); document.getElementById('cEdge').value = hex(B.edge); };
  ls.onchange = () => { syncColor(); restart(); };
  if (Q.get('mode')) document.getElementById('mode').value = Q.get('mode');
  fillLooks();
  document.getElementById('mode').addEventListener('change', fillLooks);
  if (Q.get('recipe')) rs.value = Q.get('recipe');
  if (Q.get('look')) ls.value = Q.get('look');
  if (Q.get('s')) document.getElementById('s').value = Q.get('s');
  syncColor();
  for (const id of ['recipe', 's', 'cGlow', 'cEdge']) document.getElementById(id).onchange = restart;
  const scs = document.getElementById('scheme'), bgs = document.getElementById('bg');
  scs.value = TrioFX.scheme(); bgs.value = Q.get('bg') || 'night';
  scs.onchange = () => { TrioFX.setScheme(scs.value); restart(); };
  bgs.onchange = async () => { BG = await loadBg(bgs.value); restart(); };
  document.getElementById('mode').addEventListener('change', () => { syncColor(); restart(); });
  document.getElementById('dir').oninput = (e) => { document.getElementById('dirv').textContent = e.target.value + '°'; restart(); };
  document.getElementById('go').onclick = restart;

  if (Q.get('film')) { window.FILM = film(Q.get('film')); document.title = 'FILMDONE'; return; }
  if (Q.get('bench')) { const r = bench(+(Q.get('frames') || 600)); window.BENCH = r; document.title = 'BENCHDONE ' + JSON.stringify(r); document.getElementById('note').textContent = JSON.stringify(r); return; }
  restart();
  t0 = performance.now();
  requestAnimationFrame(frame);
})();
