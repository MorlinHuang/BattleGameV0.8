<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>查手机</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c0e12;color:#e8ecf2;font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 14px}
  h1{font-size:17px;font-weight:600;letter-spacing:.02em}
  /* 最终画面是 1080×1920 竖屏（9:16）。画布 960×1707 = 同一比例；舞台按窗口高度放满。
     下面那截（1334 以下）是补画出来的地板，调试按钮就叠在这截地板上 —— 正式直播时按钮
     不存在，那块就是地板，不能是纯黑 */
  #stage{position:relative;width:min(calc(100vw - 28px),calc((100vh - 60px) * 9 / 16));aspect-ratio:960/1707;
         border-radius:12px;overflow:hidden;box-shadow:0 12px 44px rgba(0,0,0,.6);container-type:inline-size}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fx{touch-action:none}
  /* 1334/1707 = 78.2%：按钮区从这里往下，正好是原来 960×1334 画面底边以下补出来的地板 */
  .panel{position:absolute;left:0;right:0;top:78.2%;bottom:0;padding:1.6cqw 2.5cqw;
         display:flex;flex-direction:column;justify-content:center;gap:1.3cqw;font-size:2.7cqw;
         background:linear-gradient(rgba(12,14,18,0),rgba(12,14,18,.35) 30%)}
  .row{display:flex;align-items:center;gap:1.5cqw;flex-wrap:nowrap}
  input[type=range]{flex:1;accent-color:#7ed957}
  button{background:rgba(27,32,41,.82);color:#e8ecf2;border:1px solid #2c333f;border-radius:1.4cqw;
         padding:1.1cqw 2cqw;font-size:2.7cqw;cursor:pointer;font-family:inherit;white-space:nowrap}
  button:hover{background:#242b36}
  .side{font-size:2.6cqw;color:#e8ecf2;text-shadow:0 1px 3px #000;min-width:8cqw}
  .side.g{color:#9ee87a} .side.r{color:#ff9b9b}
  select{background:rgba(27,32,41,.82);color:#e8ecf2;border:1px solid #2c333f;border-radius:1.2cqw;
         padding:.8cqw 1.2cqw;font-size:2.6cqw;font-family:inherit;cursor:pointer}
  #hitL{border-color:#4a7a33;color:#9ee87a} #hitR{border-color:#7a3a3a;color:#ff9b9b}
  label{display:flex;align-items:center;gap:1cqw;color:#e8ecf2;text-shadow:0 1px 3px #000;font-size:2.6cqw;cursor:pointer;user-select:none}
  #stat,#msg{font:2.2cqw ui-monospace,Menlo,monospace;color:#6d7683}
  /* 逐帧战况读数是开发信息，默认不出现 —— 这个页面要拿给合作方体验。?dev=1 打开 */
  #devrow{display:none}
</style>
</head>
<body>
<h1>查手机</h1>

<div id="stage">
  <canvas id="bg" width="960" height="1707"></canvas>
  <canvas id="ch" width="960" height="1707"></canvas>
  <canvas id="fx" width="960" height="1707"></canvas>
<div class="panel">
  <div class="row">
    <button id="hitL">查岗党 +7</button>
    <input id="pv" type="range" min="0" max="100" step="0.5" value="50">
    <button id="hitR">灭迹党 +7</button>
  </div>
  <!-- 按钮文字由 main.js 按 ITEM_OF + GIFT.name 覆写成实际飞出来的物品名（左边
       口红/抱枕/闺蜜/戒指盒，右边香蕉/手柄/哥们/相框）。这里写的只是没跑 JS 时
       的回退，data-shop 才是真的入口 —— 它指的是平台礼物，数值从那边来。 -->
  <div class="row">
    <span class="side g">查岗党</span>
    <button data-shop="like" data-side="1">点赞 ⓪</button>
    <button data-shop="wand" data-side="1">口红 ①</button>
    <button data-shop="mirror" data-side="1">抱枕 ②</button>
    <button data-shop="boom" data-side="1">闺蜜 ③</button>
    <button data-shop="drop" data-side="1">戒指盒 ④</button>
  </div>
  <div class="row">
    <span class="side r">灭迹党</span>
    <button data-shop="like" data-side="-1">点赞 ⓪</button>
    <button data-shop="wand" data-side="-1">香蕉 ①</button>
    <button data-shop="mirror" data-side="-1">手柄 ②</button>
    <button data-shop="boom" data-side="-1">奶茶 ③</button>
    <button data-shop="drop" data-side="-1">相框 ④</button>
  </div>
  <div class="row">
    <button id="start">开始对局</button>
    <label>直击力度<select id="pw"><option value="1">点赞级</option><option value="2" selected>普通礼物</option><option value="3">大礼物</option></select></label>
    <label><input id="auto" type="checkbox">自动演示</label>
  </div>
  <div class="row" id="devrow"><span id="stat"></span><span id="msg"></span></div>
</div>
</div>

<script>
/* 脚本用 document.write 插入，是为了能把 URL 上的 ?v= 透传到每个 js 的地址上。
   截图/压测都要共享磁盘缓存（帧素材 49MB，不走缓存每次加载要两分钟），而共享
   缓存连 js 一起缓存 —— 改完代码截出来的还是旧画面，且没有任何报错。踩过一次，
   排查掉小半个钟头。带上 ?v=<任意变化的值> 就能只让 js 失效、图片照旧走缓存。
   document.write 在解析期插入，执行顺序与写死 script 标签完全一致。 */
(function () {
  var v = new URLSearchParams(location.search).get('v');
  var q = v ? '?v=' + encodeURIComponent(v) : '';
  var fs = ['fx.js', 'ammo.js', 'crew.js', 'bubble.js', 'result.js', 'main.js'];
  for (var i = 0; i < fs.length; i++) document.write('<scr' + 'ipt src="' + fs[i] + q + '"></scr' + 'ipt>');
  /* 读数行本身要留着（截图与压测都往里写），只是默认藏起来。这里必须写死 'flex'
     而不是清空 —— 清空只是去掉行内样式，#devrow{display:none} 那条还在，行还是不出来。 */
  if (new URLSearchParams(location.search).has('dev')) document.getElementById('devrow').style.display = 'flex';
})();
</script>
</body>
</html>
